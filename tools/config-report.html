<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Configuration Report • Tools</title>
  <meta name="description" content="Generate a structured configuration report Word document." />
  <link rel="stylesheet" href="../assets/site.css" />
  <link rel="stylesheet" href="../assets/tools.css" />
  <script defer src="../assets/app.js"></script>
  <script defer src="../assets/app-tools.js"></script>
</head>

<body data-page="tools">
  <header class="top">
    <div class="container">
      <div class="navGlass">
        <a class="brand" href="../index.html" aria-label="Home">
          <span class="brandMark">S</span>
          <span class="brandName">Server Admin Academy</span>
        </a>

        <nav class="navLinks" aria-label="Main navigation">
          <a class="navLink" href="../index.html">Home</a>
          <a class="navLink" href="./index.html">Tools</a>
          <a class="navLink" href="../activity.html">Simulation</a>
        </nav>

        <div class="navCta">
          <a class="btn btnPill" href="./index.html">All Tools ✦</a>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="section glowSection toolWrap" data-tool="report">
      <div class="glowLayer" aria-hidden="true"></div>
      <div class="container">
        <div class="toolHead">
          <h1 class="toolTitle">Configuration Report</h1>
          <p class="toolSub">
            Use this when you complete a server administration configuration and need to document how it works.
            One line per bullet item.
          </p>
        </div>

        <div class="toolCard">
          <form>
            <div class="formGrid">
              <div class="field">
                <label class="label" for="rp_title">Report Title</label>
                <input class="input" id="rp_title" placeholder="Example: DNS & AD DS Configuration Report" />
              </div>

              <div class="field third">
                <label class="label" for="rp_system">System</label>
                <input class="input" id="rp_system" placeholder="Example: NV-DC1" />
              </div>

              <div class="field third">
                <label class="label" for="rp_role">Role / Service</label>
                <input class="input" id="rp_role" placeholder="Example: DNS (AD-integrated)" />
              </div>

              <div class="field third">
                <label class="label" for="rp_version">Version / Build</label>
                <input class="input" id="rp_version" placeholder="Example: Windows Server 2022" />
              </div>

              <div class="field half">
                <label class="label" for="rp_author">Author</label>
                <input class="input" id="rp_author" placeholder="Student / Team" />
              </div>

              <div class="field half">
                <label class="label" for="rp_date">Report Date</label>
                <input class="input" id="rp_date" placeholder="Example: 2026-03-02" />
              </div>

              <div class="field">
                <label class="label" for="rp_objectives">Objectives (one line per item)</label>
                <textarea class="textarea" id="rp_objectives" placeholder="Provide internal name resolution for newvue.local\nSupport Active Directory SRV record resolution\nEnable client domain join"></textarea>
              </div>

              <div class="field">
                <label class="label" for="rp_architecture">Architecture Overview</label>
                <textarea class="textarea" id="rp_architecture" placeholder="Describe the role of this server/service in the environment. Mention clients, zones/scopes, replication, and integrations."></textarea>
              </div>

              <div class="field">
                <label class="label" for="rp_configuration">Configuration Details (one line per item)</label>
                <textarea class="textarea" id="rp_configuration" placeholder="Installed DNS role\nCreated AD-integrated forward lookup zone newvue.local\nConfigured forwarders\nCreated reverse lookup zone"></textarea>
              </div>

              <div class="field">
                <label class="label" for="rp_validation">Validation / Evidence (one line per item)</label>
                <textarea class="textarea" id="rp_validation" placeholder="nslookup resolves hostnames\nSRV records resolve from client\nClient successfully joins domain\nScreenshot of DNS zones"></textarea>
              </div>

              <div class="field">
                <label class="label" for="rp_operations">Operational Notes (one line per item)</label>
                <textarea class="textarea" id="rp_operations" placeholder="Backup schedule\nMonitoring/log locations\nChange control expectations\nCommon failure points"></textarea>
              </div>

              <div class="field">
                <label class="label" for="rp_risks">Risks / Considerations (one line per item)</label>
                <textarea class="textarea" id="rp_risks" placeholder="Misconfigured client DNS causes domain join failures\nForwarder outages impact external resolution\nIncorrect dynamic update settings can create stale records"></textarea>
              </div>

              <div class="field">
                <label class="label" for="rp_future">Future Improvements (one line per item)</label>
                <textarea class="textarea" id="rp_future" placeholder="Add scavenging\nDocument recovery steps\nImplement secondary DNS server"></textarea>
              </div>
            </div>

            <div class="toolActions">
              <a class="btnGhost2" href="./index.html">Back</a>
              <button class="btnPrimary" id="btnGenerate" type="submit">Generate Word Document</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footerInner">
      <div class="footerBrand">
        <span class="brandMark">S</span>
        <span>Server Admin Academy</span>
      </div>
      <div class="footerLinks">
        <a href="../index.html">Home</a>
        <a href="./index.html">Tools</a>
      </div>
    </div>
  </footer>
</body>
</html>
